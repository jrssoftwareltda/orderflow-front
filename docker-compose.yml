services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_LOG_LEVEL: ${VITE_LOG_LEVEL:-info}
        VITE_DEBUG_API: ${VITE_DEBUG_API:-false}
        VITE_DEBUG_UI: ${VITE_DEBUG_UI:-false}
    container_name: orderflow-frontend
    ports:
      - "3000:80"
    environment:
      API_GATEWAY_UPSTREAM: ${API_GATEWAY_UPSTREAM:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
